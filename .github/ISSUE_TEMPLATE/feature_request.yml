name: 功能建议
description: 提交有明确场景、价值与验收标准的新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请优先描述真实使用场景、当前阻碍和期望结果，而不只是某个按钮或具体实现。

        清晰的范围和验收标准有助于维护者评估优先级、兼容性与实现成本。

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，确认没有相同或高度相似的建议。
          required: true
        - label: 我确认该建议与本项目的本地语音助手、交互界面或相关集成功能有关。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与现有问题
      description: 谁在什么场景下遇到了什么困难？现有行为为何不足？请尽量提供具体案例。
      placeholder: 当用户在……场景下尝试……时，目前只能……，因此会……
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果与价值
      description: 实现后应改善什么？可从效率、准确率、延迟、可靠性、隐私或易用性等方面说明。
      placeholder: 用户将能够……；预期可以减少……并改善……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与交互流程
      description: 描述建议的行为、触发条件、主要流程和异常处理。无需限定具体代码实现。
      placeholder: |
        1. 当……时触发……
        2. 系统应……
        3. 用户可以……
        4. 如果……失败，则……
    validations:
      required: true

  - type: dropdown
    id: components
    attributes:
      label: 涉及模块
      description: 请选择所有可能受影响的模块。
      multiple: true
      options:
        - 安装、启动或配置
        - 麦克风、KWS 或 VAD
        - 语音识别（ASR）
        - Agent、路由或工具调用
        - 语音合成或播放（TTS）
        - 打断、回声消除或全双工
        - 悬浮层或 Control Center
        - 助手人设、提示词或多助手
        - 第三方服务或设备集成
        - 文档、开发体验或测试
        - 其他或不确定
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: 目标平台
      description: 请选择希望支持的平台。
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - 全平台
        - 与平台无关
        - 不确定
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 请列出可观察、可测试的完成条件，帮助维护者判断功能何时达到预期。
      placeholder: |
        - [ ] 在……条件下，系统能够……
        - [ ] 当……失败时，系统会……
        - [ ] 不影响现有的……行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 说明目前的绕行方法、第三方方案或不采用该功能时的影响；若没有可填写“无”。

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性、风险与范围边界
      description: 是否涉及配置迁移、资源占用、隐私权限、模型下载、平台差异或现有行为变更？哪些内容明确不在本建议范围内？

  - type: dropdown
    id: priority
    attributes:
      label: 影响程度
      description: 请按对实际使用的影响选择，而不是按个人偏好选择。
      options:
        - 阻碍核心使用场景
        - 显著改善高频场景
        - 改善一般使用体验
        - 锦上添花
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - 我愿意提交 Pull Request
        - 我愿意协助设计或测试
        - 我可以补充更多信息
        - 暂时无法参与实现
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充资料
      description: 可提供原型、流程图、参考实现、相关 Issue/PR 或其他有助于评估的资料。
