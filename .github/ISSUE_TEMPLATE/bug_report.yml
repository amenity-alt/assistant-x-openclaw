name: Bug 反馈
description: 报告可复现的问题或异常行为
title: "[Bug] "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug。请尽可能完整地填写以下信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述你遇到的问题。
      placeholder: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 执行……
        4. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为正确的行为应该是什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 项目版本
      placeholder: 例如 v1.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - iOS
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或错误信息
      description: 请粘贴相关日志，并注意删除密钥、Token 等敏感信息。
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可以提供截图、录屏、配置文件或其他上下文。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issues，没有发现重复问题。
          required: true
        - label: 我已经删除日志中的密码、Token 等敏感信息。
          required: true
